apply plugin: 'com.android.application'

// Gabs Remote: arquivo com os dados da keystore de release (nunca no repositório).
def gabsKeystoreProps = file(System.getenv('GABS_KEYSTORE_PROPS') ?: "${System.getProperty('user.home')}/.gabs-remote/keystore.properties")

// Gabs Remote: versão do sistema (versao.json, decisão 0006). Sem -PgabsVersion: 0.0.0 e versionCode 1,
// e o build de release falha (use tools/build/build-android.ps1).
def gabsVersion = project.findProperty('gabsVersion') ?: '0.0.0'
def gabsMinHost = project.findProperty('gabsMinHost') ?: '0.0.0'
def gabsVersionCode = { String v ->
    def m = v =~ /^(\d{1,3})\.(\d{1,3})\.(\d{1,3})$/
    if (!m.matches()) {
        throw new GradleException("gabsVersion inválida: '${v}' (use x.y.z)")
    }
    int code = (m.group(1) as int) * 1000000 + (m.group(2) as int) * 1000 + (m.group(3) as int)
    return code == 0 ? 1 : code
}
if (!(gabsMinHost ==~ /^\d{1,3}\.\d{1,3}\.\d{1,3}$/)) {
    throw new GradleException("gabsMinHost inválida: '${gabsMinHost}' (use x.y.z)")
}
gradle.taskGraph.whenReady { graph ->
    if (!project.hasProperty('gabsVersion') && graph.allTasks.any { it.name ==~ /assemble.*Release|bundle.*Release/ }) {
        throw new GradleException('passe -PgabsVersion (use build-android.ps1)')
    }
}

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        // Gabs Remote: versão única do sistema, do versao.json (decisão 0006), passada por
        // build-android.ps1 com -PgabsVersion e -PgabsMinHost. versionCode = major·1000000 + minor·1000 + patch.
        versionName gabsVersion
        versionCode = gabsVersionCode(gabsVersion)
        buildConfigField "String", "GABS_MIN_HOST", "\"${gabsMinHost}\""

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.gabtavares.gabsremote.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.gabtavares.gabsremote"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    // Gabs Remote: keystore de release fora do repositório (docs/segredos.md).
    signingConfigs {
        release {
            if (gabsKeystoreProps.exists()) {
                def props = new Properties()
                gabsKeystoreProps.withInputStream { props.load(it) }
                // storeFile relativo vale a partir da pasta do keystore.properties
                def sf = new File(props['storeFile'] as String)
                storeFile sf.isAbsolute() ? sf : new File(gabsKeystoreProps.parentFile, sf.path)
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Gabs Remote (Debug)"
            resValue "string", "app_label_root", "Gabs Remote (Root Debug)"
        }
        release {
            // Gabs Remote: applicationId próprio (com.gabtavares.gabsremote), sem o sufixo do upstream.
            resValue "string", "app_label", "Gabs Remote"
            resValue "string", "app_label_root", "Gabs Remote (Root)"

            // Gabs Remote: assina com a keystore do Gab quando keystore.properties existe.
            if (gabsKeystoreProps.exists()) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Gabs Remote: testes unitários dos módulos com.limelight.gabs
    testImplementation 'junit:junit:4.13.2'
    // Gabs Remote: org.json de verdade nos testes (o do android.jar é só stub)
    testImplementation 'org.json:json:20231013'
}
